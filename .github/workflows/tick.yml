# 10분마다 RUTI 서버를 깨우고, 보낼 시간이 된 루틴 알림을 보내게 한다 (무료 서버는 15분 쉬면 잠듦)
name: ruti-tick
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://ruti.onrender.com/push/tick || true
