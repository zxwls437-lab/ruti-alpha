# Render Blueprint: GitHub 저장소를 연결하면 웹 서비스 + PostgreSQL을 한 번에 만든다.
# 비밀 값(sync: false)은 Render 화면에서 직접 입력한다. 여기에 키를 적지 마세요.
services:
  - type: web
    name: ruti
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ruti-db
          property: connectionString
      - key: RUTI_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: RUTI_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini

databases:
  - name: ruti-db
    plan: free
    region: singapore
    databaseName: ruti
    user: ruti
