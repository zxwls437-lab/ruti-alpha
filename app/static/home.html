<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#4F7D6E"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RUTI">
<title>RUTI</title><link rel="stylesheet" href="/static/common.css">
<style>
.auth{max-width:380px;margin:40px auto}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hello h1{margin:2px 0 0;font-size:25px;font-weight:600;letter-spacing:-.3px}
.skinbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:none;color:var(--text);padding:4px 0;min-height:44px;font-weight:400;width:100%;text-align:left}
.skinbar b{color:var(--brand);font-size:14px}.skinbar .tag{margin:0;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:13px;padding:5px 12px}
.today{display:block;background:var(--soft);border-radius:26px;padding:18px 20px;text-decoration:none;color:var(--text);position:relative;overflow:hidden}
.today::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:color-mix(in srgb,var(--brand) 14%,transparent)}
.today h2{margin:0 0 10px;font-size:18px}.today .go{position:absolute;right:20px;top:18px;color:var(--brand);font-weight:700;font-size:14px;z-index:1}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.slot{background:var(--card);border-radius:18px;padding:12px 14px}.slot b{font-size:15px}.slot .muted{font-size:13px}
.slot .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}.slot .bar i{display:block;height:100%;background:var(--brand)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick a{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;text-decoration:none;color:var(--text);min-height:110px}
.quick .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--brand)}
.quick b{font-size:16px}.quick span.muted{font-size:12.5px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moods button{background:var(--card);border:1px solid var(--line);color:var(--text);min-height:60px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500;font-size:13px}
.moods button span{font-size:22px}.moods button[aria-pressed="true"]{border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:700}
.tip{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.tip .k{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.04em}.tip p{margin:6px 0 0;line-height:1.65}
.listcard h2{display:flex;justify-content:space-between;align-items:baseline}.listcard h2 a{font-size:13px;font-weight:600;text-decoration:none}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.li:last-child{border-bottom:0}.li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t{font-size:11.5px;padding:3px 9px;border-radius:12px;font-weight:700;flex-shrink:0}
.t.green{background:var(--soft);color:var(--brand)}.t.orange{background:#FCF1DE;color:#84601F}.t.red{background:#FBE7E3;color:#A44A3F}
.post .meta{font-size:12px;color:var(--muted)}
</style></head><body>
<nav><b>RUTI</b><a href="/home" class="on">홈</a><a href="#" id="logout" class="hidden">로그아웃</a></nav>
<main>
  <form class="card auth stack hidden" id="authForm">
    <h2>로그인</h2>
    <p class="muted">찍으면 내 피부에 맞는지 알려주는 RUTI예요.</p>
    <input name="username" placeholder="아이디" autocomplete="username" required>
    <input name="password" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password" required>
    <div class="row"><button type="submit">로그인</button><button type="button" class="ghost" data-signup>회원가입</button></div>
    <div class="error"></div>
  </form>

  <div id="app" class="wrap hidden">
    <div class="hello"><span class="muted" id="helloName">안녕하세요</span><h1>오늘 피부는 어떠세요?</h1></div>
    <button type="button" class="skinbar" id="skinBar" aria-label="내 피부 정보 고치기"><span class="muted">내 피부</span><span id="skinChips" class="chip-row" style="margin:0"></span><b>수정</b></button>

    <a class="today" href="/routine"><span class="go">루틴 보기 ›</span><h2>오늘의 루틴</h2>
      <div class="slots"><div class="slot"><b>☀️ 아침</b><div class="muted" id="amText"></div><div class="bar"><i id="amBar"></i></div></div>
        <div class="slot"><b>🌙 저녁</b><div class="muted" id="pmText"></div><div class="bar"><i id="pmBar"></i></div></div></div></a>

    <div class="quick">
      <a href="/scan"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><b>성분표 찍기</b><span class="muted">내 피부에 맞는지 바로</span></a>
      <a href="/chat"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span><b>RUTI에게 묻기</b><span class="muted">피부 고민 상담</span></a>
    </div>

    <section class="card" id="moodCard">
      <h2>오늘 피부 컨디션</h2>
      <div class="moods" id="moods"></div>
    </section>

    <div class="tip"><div class="k" id="tipKind">오늘의 피부 팁</div><p id="tip"></p></div>

    <section class="card listcard">
      <h2>최근 분석한 화장품 <a href="/scan">더 보기</a></h2>
      <div id="recent"></div>
    </section>

    <section class="card listcard">
      <h2>커뮤니티 새 글 <a href="/community">더 보기</a></h2>
      <div id="posts"></div>
    </section>
  </div>
</main>
<script src="/static/common.js"></script>
<script src="/static/explain.js"></script>
<script>
const $ = id => document.getElementById(id), {el, api} = RUTI;
const MOODS = [[1, '😣', '안 좋아요'], [2, '😐', '보통이에요'], [3, '😊', '좋아요']];

// 오늘의 팁: 피부 정보와 계절(한국 기준)에 맞는 것 중 날짜마다 하나
const TIPS = [
  ['all', '세안은 미지근한 물로 해요. 뜨거운 물은 피부 보호막을 약하게 할 수 있어요.'],
  ['all', '새 제품은 팔 안쪽에 먼저 발라 보고, 하루 지나도 괜찮으면 얼굴에 써요.'],
  ['all', '선크림은 흐린 날에도 발라요. 자외선은 구름을 통과해요.'],
  ['all', '보습제는 세안 후 3분 안에 바르면 수분이 덜 날아가요.'],
  ['all', '베개 커버를 자주 바꾸면 트러블 관리에 도움이 돼요.'],
  ['건성', '건성 피부는 각질 제거를 주 1회 정도로 줄이고, 보습을 먼저 챙겨요.'],
  ['건성', '자기 전 보습 크림을 조금 두껍게 바르면 아침 당김이 줄어요.'],
  ['지성', '번들거린다고 세안을 너무 자주 하면 오히려 피지가 더 나올 수 있어요. 하루 두 번이면 충분해요.'],
  ['지성', '지성 피부도 보습은 필요해요. 가벼운 젤 제형을 골라 보세요.'],
  ['복합성', 'T존과 볼을 다르게 관리해 보세요. 볼에만 크림을 한 번 더 발라도 좋아요.'],
  ['민감성', '민감한 피부는 한 번에 한 제품씩 바꿔야 무엇이 맞지 않는지 알 수 있어요.'],
  ['민감성', '향료·알코올이 앞쪽에 적힌 제품은 성분표를 한 번 더 확인해요.'],
  ['winter', '겨울엔 실내가 건조해요. 가습기나 젖은 수건으로 습도를 챙겨 주세요.'],
  ['summer', '여름엔 땀이 나도 선크림을 2~3시간마다 덧발라 주세요.'],
  ['spring', '환절기엔 피부가 예민해지기 쉬워요. 새 제품은 잠시 미뤄도 좋아요.'],
];
function pickTip(memories){
  const m = new Date().getMonth() + 1, season = m <= 2 || m === 12 ? 'winter' : m <= 5 ? 'spring' : m <= 8 ? 'summer' : 'spring';
  const text = memories.join(' ');
  const pool = TIPS.filter(([k]) => k === 'all' || k === season || text.includes(k));
  const personal = pool.filter(([k]) => k !== 'all');
  const day = Math.floor(Date.now() / 86400000);
  const list = personal.length && day % 2 === 0 ? personal : pool;  // 이틀에 한 번은 내 피부·계절 맞춤 팁
  const [k, t] = list[day % list.length];
  $('tipKind').textContent = k === 'all' ? '오늘의 피부 팁' : ['winter', 'summer', 'spring'].includes(k) ? '이번 계절 피부 팁' : `${k} 피부 팁`;
  $('tip').textContent = t;
}

let routine = null;
function renderRoutine(){
  for (const s of ['am', 'pm']) {
    const list = routine.routine[s], done = list.filter(i => i.done).length;
    $(s + 'Text').textContent = list.length ? `${list.length}단계 중 ${done}단계` : '아직 비어 있어요';
    $(s + 'Bar').style.width = list.length ? `${done / list.length * 100}%` : '0';
  }
  const todayLog = routine.logs.find(l => l.day === routine.today);
  $('moodCard').classList.toggle('hidden', !routine.can_log);
  $('moods').replaceChildren(...MOODS.map(([v, e, t]) => {
    const b = el('button', {type: 'button', onclick: async () => { routine = await api('/routine/log', {method: 'PUT', body: {mood: v}}); renderRoutine(); }}, el('span', {}, e), t);
    b.setAttribute('aria-pressed', String(!!todayLog && todayLog.mood === v)); return b;
  }));
}
async function loadSkin(){
  try {
    const {memories} = await api('/memory');
    $('skinChips').replaceChildren(...(memories.length ? RUTI.skin.chips(memories.slice(0, 4)) : [el('span', {class: 'muted'}, '골라 주세요')]));
    pickTip(memories.map(m => m.content));
  } catch { $('skinBar').classList.add('hidden'); pickTip([]); }
}
$('skinBar').addEventListener('click', () => RUTI.skin.open(async () => { await loadSkin(); routine = await api('/routine/today'); renderRoutine(); }));
async function loadRecent(){
  const V = {good: ['green', '잘 맞아요'], check: ['orange', '확인 필요'], avoid: ['red', '맞지 않을 수 있어요']};
  const {scans} = await api('/scan/history?limit=3');
  $('recent').replaceChildren(...(scans.length ? scans.map(s => el('a', {class: 'li', href: '/scan'}, el('span', {class: 'nm'}, s.product_name || '이름 없는 제품'),
    V[s.level] ? el('span', {class: 't ' + V[s.level][0]}, V[s.level][1]) : null)) : [el('p', {class: 'muted', style: 'margin:0'}, '아직 분석한 제품이 없어요. 성분표를 찍어 보세요.')]));
}
async function loadPosts(){
  try {
    const {posts} = await api('/community/posts?limit=2');
    $('posts').replaceChildren(...(posts.length ? posts.map(p => el('a', {class: 'li post', href: '/community'},
      el('span', {style: 'min-width:0'}, el('div', {class: 'nm'}, p.title), el('div', {class: 'meta'}, `${p.kind_label} · 도움돼요 ${p.helpful_count} · 댓글 ${p.comment_count}`)))) : [el('p', {class: 'muted', style: 'margin:0'}, '아직 글이 없어요.')]));
  } catch { $('posts').replaceChildren(); }
}
async function start(){
  let me;
  try { me = await api('/auth/me'); } catch { $('authForm').classList.remove('hidden'); return; }
  if (me.needs_consent && me.needs_consent.length) { $('authForm').classList.add('hidden'); return RUTI.afterLogin(me, start); }
  $('authForm').classList.add('hidden'); $('app').classList.remove('hidden');
  $('helloName').textContent = `안녕하세요, ${me.name || me.nickname || ''}님`;
  loadSkin(); loadRecent(); loadPosts();
  routine = await api('/routine/today'); renderRoutine();
  RUTI.skin.promptOnce(me, loadSkin);
}
RUTI.bindAuth($('authForm'), start);
start();
</script></body></html>
