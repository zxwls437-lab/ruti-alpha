<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#4F7D6E"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RUTI">
<title>RUTI 내 정보</title><link rel="stylesheet" href="/static/common.css">
<style>
.auth{max-width:380px;margin:40px auto}
.wrap{max-width:640px;margin:0 auto}
.profile{display:flex;gap:14px;align-items:center}
.avatar{width:56px;height:56px;border-radius:28px;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;gap:6px}
.stats b{display:block;font-size:20px}
.stats a{text-decoration:none;color:var(--muted);font-size:13px}.stats a b{color:var(--text)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.switch{position:relative;width:46px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--line);cursor:pointer;transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--brand)}.switch input:checked+span::after{left:21px}
.switch input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.menu{padding:0 18px}
.menu details{border-bottom:1px solid var(--line)}
.menu summary,.menu-row{display:flex;align-items:center;justify-content:space-between;min-height:54px;cursor:pointer;list-style:none;font-size:15px}
.menu summary::-webkit-details-marker{display:none}
.menu summary::after{content:"›";color:var(--muted);font-size:20px;transition:transform .15s}
.menu details[open] summary::after{transform:rotate(90deg)}
.menu details>*:not(summary){margin-bottom:14px}
.menu-row{width:100%;background:none;color:var(--text);padding:0;border-radius:0;font-weight:400}
.menu #delete summary{color:var(--danger)}
button.small{min-height:36px;padding:4px 14px;font-size:13px}
#mems .tag{font-size:14px;padding:6px 12px;margin:0}
.ok{color:var(--brand);font-size:14px;min-height:1em}
</style></head><body>
<nav><b>RUTI</b><a href="/chat">상담</a><a href="/scan">성분 분석</a><a href="/community">커뮤니티</a><a href="/mypage" class="on">내 정보</a></nav>
<main>
  <form class="card auth stack hidden" id="authForm">
    <h2>로그인</h2>
    <input name="username" placeholder="아이디" autocomplete="username" required>
    <input name="password" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password" required>
    <div class="row"><button type="submit">로그인</button><button type="button" class="ghost" data-signup>회원가입</button></div>
    <div class="error"></div>
  </form>

  <div id="app" class="wrap hidden">
    <section class="card stack">
      <div class="profile">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <div style="flex:1;min-width:0"><h2 style="margin:0" id="pName"></h2><div class="muted" id="pSub"></div></div>
      </div>
      <div class="stats" id="stats"></div>
      <div id="planBox" style="background:var(--soft);border-radius:14px;padding:12px 14px"></div>
    </section>

    <section class="card stack">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">내 피부</h2><button type="button" class="ghost small" id="skinEdit">수정</button></div>
      <div id="mems" class="chip-row"></div>
    </section>

    <div class="menu card">
      <details>
        <summary>프로필 수정</summary>
        <form id="profileForm" class="stack">
          <label class="muted" for="fName">이름 (나만 보여요)</label>
          <input id="fName" name="name" maxlength="30" required>
          <label class="muted" for="fNick">닉네임 (커뮤니티에 보여요)</label>
          <input id="fNick" name="nickname" maxlength="20" required>
          <button>저장</button><div class="ok" id="profileMsg"></div>
        </form>
      </details>
      <details>
        <summary>동의·알림</summary>
        <div id="consents"></div>
        <div class="ok" id="consentMsg"></div>
      </details>
      <details>
        <summary>차단한 사용자</summary>
        <div id="blocks"></div>
      </details>
      <details>
        <summary>비밀번호 변경</summary>
        <form id="pwForm" class="stack">
          <input name="current_password" type="password" placeholder="현재 비밀번호" autocomplete="current-password" required>
          <input name="new_password" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" minlength="8" required>
          <button>변경</button><div class="ok" id="pwMsg"></div>
        </form>
      </details>
      <details>
        <summary>내 데이터 내려받기</summary>
        <button type="button" class="ghost" id="exportBtn">JSON 파일로 받기</button>
      </details>
      <details id="delete">
        <summary>회원 탈퇴</summary>
        <form id="deleteForm" class="stack">
          <p style="margin:0">피부 정보, 기록, 후기, 글이 모두 지워지고 되돌릴 수 없어요.</p>
          <input name="password" type="password" placeholder="비밀번호 확인" autocomplete="current-password" required>
          <button class="danger">탈퇴하기</button><div class="error" id="delErr"></div>
        </form>
      </details>
      <button type="button" class="menu-row" id="logoutBtn">로그아웃</button>
    </div>
    <p class="muted" style="text-align:center">약관 버전 <span id="termsVer"></span> · RUTI는 의료 진단을 대신하지 않아요<br><a href="/terms">이용약관</a> · <a href="/privacy"><b>개인정보 처리방침</b></a> · <a href="/account-deletion">계정 삭제 안내</a></p>
  </div>
</main>
<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id), {el, api} = RUTI;
const flash = (id, text) => { $(id).textContent = text; setTimeout(() => { $(id).textContent = ''; }, 2500); };

async function loadProfile(){
  const [me, vanity, mine, history] = await Promise.all([api('/me'), api('/vanity'), api('/reviews/mine'), api('/scan/history?limit=100')]);
  $('avatar').textContent = (me.name || me.nickname || '나').charAt(0);
  $('pName').textContent = (me.name || '이름 없음') + '님';
  $('pSub').textContent = '@' + me.nickname + ' · ' + me.username;
  $('fName').value = me.name; $('fNick').value = me.nickname;
  $('termsVer').textContent = me.terms_version;
  const t = me.today, lim = (used, limit) => limit ? `${used} / ${limit}회` : `${used}회`;
  $('planBox').replaceChildren(...[
    el('div', {class: 'row'}, el('b', {}, me.plan === 'plus' ? 'RUTI Plus 이용 중' : '무료 이용 중'),
      me.plus_until ? el('span', {class: 'muted', style: 'flex:0 0 auto'}, me.plus_until.slice(0, 10) + '까지') : null),
    el('div', {class: 'muted', style: 'margin-top:4px'}, `오늘 상담 ${lim(t.chat_used, t.chat_limit)} · 사진 분석 ${lim(t.scan_used, t.scan_limit)}`),
  ].filter(Boolean));
  $('stats').replaceChildren(
    el('a', {href: '/scan'}, el('b', {}, history.scans.length), '분석'),
    el('a', {href: '/scan'}, el('b', {}, vanity.items.length), '화장대'),
    el('a', {href: '/scan'}, el('b', {}, mine.reviews.length), '후기'),
    el('a', {href: '/scan'}, el('b', {}, me.counts.skin_info), '피부 정보'));
  $('consents').replaceChildren(...me.consent_items.map(c => {
    const box = el('input', {type: 'checkbox', checked: me.consents[c.kind], 'aria-label': c.label});
    const locked = ['age14', 'terms', 'privacy'].includes(c.kind) && me.consents[c.kind];
    if (locked) box.disabled = true;
    box.addEventListener('change', async () => {
      if (c.kind === 'sensitive' && !box.checked && !confirm('민감정보 동의를 철회하면 저장된 피부 정보가 바로 삭제돼요. 철회할까요?')) { box.checked = true; return; }
      try { const r = await api('/me/consents', {method: 'PUT', body: {consents: {[c.kind]: box.checked}}});
        flash('consentMsg', r.deleted_skin_info ? `피부 정보 ${r.deleted_skin_info}개를 삭제했어요.` : '저장했어요.'); loadProfile(); loadMems(); }
      catch (e) { box.checked = !box.checked; flash('consentMsg', e.message); }
    });
    return el('div', {class: 'line'}, el('span', {}, (c.required ? '[필수] ' : '[선택] ') + c.label,
      locked ? el('div', {class: 'muted'}, '철회하려면 회원 탈퇴를 이용해 주세요') : null,
      c.kind === 'sensitive' ? el('div', {class: 'muted'}, '철회하면 피부 정보가 삭제되고 맞춤 판정이 꺼져요') : null),
      el('label', {class: 'switch'}, box, el('span', {})));
  }));
}
async function loadBlocks(){
  const {blocks} = await api('/blocks');
  $('blocks').replaceChildren(...blocks.map(b => el('div', {class: 'mem'}, el('span', {}, b.nickname),
    el('button', {class: 'ghost', style: 'padding:2px 10px;flex:0 0 auto', onclick: async () => { await api('/blocks/' + b.id, {method: 'DELETE'}); loadBlocks(); }}, '차단 해제'))));
  if (!blocks.length) $('blocks').append(el('p', {class: 'muted', style: 'margin:0'}, '차단한 사용자가 없어요.'));
}
async function loadMems(){
  try {
    const {memories} = await api('/memory');
    $('mems').replaceChildren(...(memories.length ? RUTI.skin.chips(memories) : [el('span', {class: 'muted'}, '아직 없어요. 수정을 눌러 골라 주세요.')]));
  } catch (e) { $('mems').replaceChildren(el('span', {class: 'muted'}, e.message)); }
}
$('skinEdit').addEventListener('click', () => RUTI.skin.open(() => { loadMems(); loadProfile(); }));
$('profileForm').addEventListener('submit', async e => {
  e.preventDefault();
  try { await api('/me', {method: 'PATCH', body: {name: e.target.name.value.trim(), nickname: e.target.nickname.value.trim()}}); flash('profileMsg', '저장했어요.'); loadProfile(); }
  catch (err) { flash('profileMsg', err.message); }
});
$('pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  try { await api('/me/password', {method: 'POST', body: {current_password: e.target.current_password.value, new_password: e.target.new_password.value}});
    e.target.reset(); flash('pwMsg', '비밀번호를 바꿨어요.'); }
  catch (err) { flash('pwMsg', err.message); }
});
$('exportBtn').addEventListener('click', async () => {
  const res = await fetch('/me/export', {headers: {Authorization: 'Bearer ' + RUTI.token}});
  if (!res.ok) return alert('내려받지 못했어요.');
  const url = URL.createObjectURL(await res.blob());
  const a = el('a', {href: url, download: 'ruti-my-data.json'}); document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
$('logoutBtn').addEventListener('click', () => RUTI.logout());
$('deleteForm').addEventListener('submit', async e => {
  e.preventDefault(); $('delErr').textContent = '';
  if (!confirm('정말 탈퇴할까요? 모든 데이터가 삭제돼요.')) return;
  try { await api('/me', {method: 'DELETE', body: {password: e.target.password.value}}); RUTI.token = ''; alert('탈퇴가 완료됐어요. 그동안 고마웠어요.'); location.href = '/chat'; }
  catch (err) { $('delErr').textContent = err.message; }
});
async function start(){
  let me;
  try { me = await api('/auth/me'); } catch { $('authForm').classList.remove('hidden'); return; }
  if (me.needs_consent && me.needs_consent.length) { $('authForm').classList.add('hidden'); return RUTI.afterLogin(me, start); }
  $('authForm').classList.add('hidden'); $('app').classList.remove('hidden');
  loadProfile(); loadMems(); loadBlocks();
  // 계정 삭제 안내 페이지(/account-deletion)에서 들어오면 탈퇴 칸을 바로 펼친다
  if (location.hash === '#delete') { $('delete').open = true; $('delete').scrollIntoView({block: 'center'}); }
}
RUTI.bindAuth($('authForm'), start);
start();
</script></body></html>
