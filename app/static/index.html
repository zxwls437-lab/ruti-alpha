<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RUTI | 개발 현황</title>
<style>:root{--bg:#f3f7f5;--card:#fff;--line:#dce8e2;--item-line:#e4ece8;--text:#182b29;--muted:#617772;--brand:#087a63;--brand-dark:#103d35;--soft:#e3f5ee;--track:#e1eee8;--shadow:#123d3310;color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
@media (prefers-color-scheme:dark){:root{--bg:#0f1716;--card:#17211f;--line:#2a3a37;--item-line:#2a3a37;--text:#e3eeea;--muted:#9fb3ad;--brand:#3cc7a2;--brand-dark:#0b2a24;--soft:#183a32;--track:#22322f;--shadow:#0000}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);word-break:keep-all;overflow-wrap:anywhere;line-height:1.5}header{background:var(--brand-dark);color:white;padding:35px max(22px,calc((100vw - 950px)/2))}header h1{margin:0;font-size:32px;letter-spacing:2px}header p{color:#cce6df}main{max-width:950px;margin:30px auto;padding:0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:18px;box-shadow:0 4px 18px var(--shadow)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.percent{font-size:48px;font-weight:800;color:var(--brand)}.bar{height:14px;background:var(--track);border-radius:20px;overflow:hidden;margin:16px 0}.fill{height:100%;background:linear-gradient(90deg,#12a785,#48c5a4);width:0}.muted{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{padding:16px;border:1px solid var(--item-line);border-radius:12px}.tag{font-size:12px;color:var(--brand);background:var(--soft);padding:5px 9px;border-radius:20px;display:inline-block;margin-top:8px}li{margin:12px 0}a{color:var(--brand)}@media(max-width:600px){.grid{grid-template-columns:1fr}.percent{font-size:38px}}
</style></head><body><header><h1>RUTI <span style="font-size:16px;font-weight:400">개발 현황</span></h1><p>스킨케어 의사결정 AI · 백엔드 및 MVP 로드맵</p></header><main>
<section class="card"><div class="top"><div><h2>전체 진행률</h2><div class="muted" id="date">확인 중</div></div><div class="percent" id="percent">--%</div></div><div class="bar"><div class="fill" id="fill"></div></div><p class="muted" id="note"></p></section>
<section class="card"><h2>기능별 개발 상태</h2><div class="grid" id="milestones"></div></section>
<section class="card"><h2>다음 작업</h2><ol id="next"></ol></section>
<section class="card"><h2>백엔드 확인</h2><p>API 상태와 명세를 브라우저에서 확인할 수 있습니다.</p><p><a href="/health">서버 상태 확인</a> · <a href="/docs">API 문서 (Swagger)</a></p><p><a href="/chat">사용자 상담 화면</a> · <a href="/scan">전성분 분석</a> · <a href="/admin">관리자 화면 (제품 검토)</a></p><p class="muted">이 화면은 개발 상태를 보여주는 대시보드입니다. 진행률은 수동으로 관리하는 추정치입니다.</p></section>
</main><script>
fetch('/status').then(r=>{if(!r.ok)throw Error('status');return r.json()}).then(d=>{document.getElementById('date').textContent='기준일: '+d.as_of;document.getElementById('percent').textContent=d.estimated_progress_percent+'%';document.getElementById('fill').style.width=d.estimated_progress_percent+'%';document.getElementById('note').textContent=d.progress_note;document.getElementById('milestones').replaceChildren(...d.milestones.map(m=>{const el=document.createElement('div');el.className='item';const name=document.createElement('strong');name.textContent=m.name;const br=document.createElement('br');const tag=document.createElement('span');tag.className='tag';tag.textContent=m.status;el.append(name,br,tag);return el}));document.getElementById('next').replaceChildren(...d.next_steps.map(n=>{const el=document.createElement('li');el.textContent=n;return el}))}).catch(()=>{document.getElementById('date').textContent='개발 현황을 불러오지 못했습니다.'});
</script></body></html>
