<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#4F7D6E"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RUTI">
<title>RUTI 상담</title><link rel="stylesheet" href="/static/common.css">
<style>
.chatwrap{display:flex;flex-direction:column;gap:8px;height:calc(100dvh - 150px);min-height:420px}
body.in-app .chatwrap{height:calc(100dvh - 90px)}
.chathead{display:flex;align-items:center;gap:8px}.chathead .skinbar{flex:1;min-width:0}
.skinbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:none;color:var(--text);padding:6px 0;min-height:44px;font-weight:400;text-align:left}
.skinbar b{color:var(--brand);font-size:14px}.skinbar .tag{margin:0;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:13px;padding:4px 10px}
button.small{min-height:36px;padding:4px 12px;font-size:13px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.msg{max-width:85%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;line-height:1.6}
.msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.warn{background:var(--warn-bg)}
.saved{align-self:flex-start;font-size:12px;color:var(--brand);background:var(--soft);padding:5px 12px;border-radius:14px}
.prod{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:13px}
.suggest{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.suggest:empty{display:none}
.suggest button{flex-shrink:0;min-height:36px;padding:0 14px;font-size:13px;background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:500}
.askbar{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px 6px 6px 14px}
.askbar textarea{border:0;padding:8px 0;resize:none;max-height:120px;background:transparent}
.askbar textarea:focus{outline:none}
.askbar button{flex:0 0 auto}
.auth{max-width:380px;margin:40px auto}
</style></head><body>
<nav><b>RUTI</b><a href="/chat" class="on">상담</a><a href="/scan">성분 분석</a><a href="/community">커뮤니티</a><a href="/mypage">내 정보</a><a href="/admin">관리자</a><a href="/">개발 현황</a><a href="#" id="logout" class="hidden">로그아웃</a></nav>
<main>
  <form class="card auth stack hidden" id="authForm">
    <h2>로그인</h2>
    <p class="muted">RUTI는 스킨케어 정보를 제공하는 AI 도우미예요. 의료 진단을 대신하지 않아요.</p>
    <input name="username" placeholder="아이디 (영문/숫자 3~30자)" autocomplete="username" required>
    <input name="password" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password" required>
    <div class="row"><button type="submit">로그인</button><button type="button" class="ghost" data-signup>회원가입</button></div>
    <div class="error"></div>
  </form>

  <div class="chatwrap hidden" id="app">
    <div class="chathead">
      <button type="button" class="skinbar" id="skinBar" aria-label="내 피부 정보 고치기"><span class="muted">내 피부</span><span id="skinChips" class="chip-row" style="margin:0"></span><b>수정</b></button>
      <button class="ghost small" id="clear" type="button">대화 지우기</button>
    </div>
    <div id="log" aria-live="polite"></div>
    <div class="suggest" id="suggest"></div>
    <form id="ask" class="askbar">
      <textarea name="message" rows="1" maxlength="2000" placeholder="피부 고민을 물어보세요" required></textarea>
      <button type="submit" aria-label="보내기">보내기</button>
    </form>
    <div class="error" id="askErr"></div>
  </div>
</main>
<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id), {el, api} = RUTI;

function productCard(p){
  return el('div', {class: 'prod'},
    el('strong', {}, p.name), p.brand ? ' · ' + p.brand : '', el('br'),
    ...(p.skin_types || []).map(s => el('span', {class: 'tag'}, s)),
    p.key_ingredients ? el('div', {class: 'muted'}, '주요 성분: ' + p.key_ingredients) : null,
    p.cautions ? el('div', {class: 'muted'}, '주의: ' + p.cautions) : null,
    p.source === 'mfds' ? el('div', {class: 'muted'}, '출처: 식품의약품안전처 기능성화장품 정보') : null,
    p.source_url ? el('a', {href: p.source_url, target: '_blank', rel: 'noopener noreferrer'}, '근거 자료') : null);
}
function addMsg(role, text, products = [], warn = false){
  const m = el('div', {class: 'msg ' + role + (warn ? ' warn' : '')}, text, ...products.map(productCard));
  $('log').append(m); $('log').scrollTop = $('log').scrollHeight; return m;
}
async function loadHistory(){
  const {messages} = await api('/conversation/history');
  $('log').replaceChildren();
  if (!messages.length) addMsg('assistant', '안녕하세요, RUTI예요. 피부 고민을 편하게 물어보세요.');
  showSuggest(!messages.length);
  messages.forEach(m => addMsg(m.role, m.content, m.products));
}
async function loadMems(){
  try {
    const {memories} = await api('/memory');
    $('skinChips').replaceChildren(...(memories.length ? RUTI.skin.chips(memories.slice(0, 4)) : [el('span', {class: 'muted'}, '골라 주세요')]));
  } catch { $('skinBar').classList.add('hidden'); }
}
$('skinBar').addEventListener('click', () => RUTI.skin.open(loadMems));
const SUGGEST = ['요즘 피부가 당겨요', '트러블에 좋은 성분은?', '아침 루틴 알려줘', '레티놀 처음 써도 될까요?'];
function showSuggest(show){ $('suggest').replaceChildren(...(show ? SUGGEST.map(q => el('button', {type: 'button', onclick: () => { $('ask').message.value = q; $('ask').requestSubmit(); }}, q)) : [])); }
async function start(){
  let me;
  try { me = await api('/auth/me'); } catch { $('authForm').classList.remove('hidden'); return; }
  if (me.needs_consent && me.needs_consent.length) { $('authForm').classList.add('hidden'); return RUTI.afterLogin(me, start); }
  $('authForm').classList.add('hidden'); $('app').classList.remove('hidden'); $('logout').classList.remove('hidden');
  loadHistory(); loadMems();
  RUTI.skin.promptOnce(me, loadMems);
}

$('ask').addEventListener('submit', async e => {
  e.preventDefault();
  const box = e.target.message, text = box.value.trim(), btn = e.target.querySelector('button');
  if (!text) return;
  $('askErr').textContent = ''; box.value = ''; btn.disabled = true;
  addMsg('user', text);
  const pending = addMsg('assistant', '답변을 준비하고 있어요…');
  try {
    const r = await api('/conversation', {method: 'POST', body: {message: text}});
    pending.remove(); showSuggest(false);
    addMsg('assistant', r.answer, r.products, r.status !== 'OK');
    if (r.saved_memories && r.saved_memories.length) {
      $('log').append(el('div', {class: 'saved'}, '내 피부 정보에 저장했어요: ' + r.saved_memories.map(RUTI.skin.label).join(', ')));
      $('log').scrollTop = $('log').scrollHeight; loadMems();
    }
  } catch (err) { pending.remove(); $('askErr').textContent = err.message; if (err.status === 401) location.reload(); }
  finally { btn.disabled = false; box.focus(); }
});
$('ask').message.addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; });
$('ask').message.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('ask').requestSubmit(); } });
$('clear').addEventListener('click', async () => { if (confirm('대화 기록을 모두 지울까요?')) { await api('/conversation/history', {method: 'DELETE'}); loadHistory(); } });
$('logout').addEventListener('click', e => { e.preventDefault(); RUTI.logout(); });
// 분석 화면의 'RUTI에게 물어보기'에서 넘어온 질문 (앱에서는 상담 탭이 이미 열려 있을 수 있어 저장소 변화도 확인)
function takePrefill(){ try { const q = localStorage.getItem('ruti_prefill'); if (q) { $('ask').message.value = q; localStorage.removeItem('ruti_prefill'); $('ask').message.focus(); } } catch {} }
takePrefill();
window.addEventListener('storage', e => { if (e.key === 'ruti_prefill' && e.newValue) takePrefill(); });
window.addEventListener('focus', takePrefill);
document.addEventListener('visibilitychange', () => { if (!document.hidden) takePrefill(); });
RUTI.bindAuth($('authForm'), start);
start();
</script></body></html>
